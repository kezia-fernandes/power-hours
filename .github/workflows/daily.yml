name: Daily forecast
on:
  schedule:
    # Two runs each morning, both before bids close at 12:00 German time:
    #   07:10 UTC = 08:10 (winter) / 09:10 (summer)
    #   09:20 UTC = 10:20 (winter) / 11:20 (summer)
    # The second run exists because the grid operators' solar, wind and demand
    # forecasts for tomorrow may not be published yet at the first one. A forecast
    # that was already saved is never overwritten; the second run only adds what
    # was missing.
    - cron: "10 7 * * *"
    - cron: "20 9 * * *"
  workflow_dispatch: # lets you start it by hand from the Actions tab

permissions:
  contents: write # needed to commit the new data back to the repository

concurrency: daily-forecast # never run two of these at the same time

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[llm]"
      # Only Germany runs here: its data is CC BY 4.0 and may be published.
      - run: python -m powerhours.ingest update --zone DE-LU --what prices power exog
      - run: python -m powerhours.forecast --zone DE-LU
      - run: python -m powerhours.briefing --zone DE-LU
        env:
          # Optional. Without this secret the briefing uses the fixed template.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public
          git diff --cached --quiet || git commit -m "Daily data and forecast $(date -u +%F)"
          git pull --rebase
          git push
