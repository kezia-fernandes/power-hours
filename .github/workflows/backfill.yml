name: Backfill history
# Run by hand (Actions tab -> Backfill history -> Run workflow) to download history
# for Germany. Safe to run again: existing rows are not duplicated.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First day to download (YYYY-MM-DD)"
        default: "2024-01-01"
      what:
        description: "What to download: any of prices power exog"
        default: "prices power exog"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m powerhours.ingest backfill --zone DE-LU --start "$START" --what $WHAT
        env:
          START: ${{ inputs.start }}
          WHAT: ${{ inputs.what }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public
          git diff --cached --quiet || git commit -m "Backfill $WHAT from $START"
          git pull --rebase
          git push
        env:
          START: ${{ inputs.start }}
          WHAT: ${{ inputs.what }}
