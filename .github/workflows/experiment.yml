name: Run experiment
# Backtests every registered model on the data in the repository and appends the
# scores to experiments/log.jsonl. Start it from the Actions tab after you change
# features or models, so you do not need the full setup on your own computer.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Short label, e.g. 'add holidays'"
        required: true
      notes:
        description: "What you changed and what you expect"
        default: ""
      days:
        description: "How many recent days to test on"
        default: "180"

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m powerhours.experiment run --name "$NAME" --notes "$NOTES" --days "$DAYS"
        env:
          NAME: ${{ inputs.name }}
          NOTES: ${{ inputs.notes }}
          DAYS: ${{ inputs.days }}
      - name: Commit the log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments
          git diff --cached --quiet || git commit -m "Experiment: $NAME"
          git pull --rebase
          git push
        env:
          NAME: ${{ inputs.name }}
